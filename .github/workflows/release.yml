name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create github release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes
          fi

  pullrequest:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.EXT_GITHUB }}
          repository: lnbits/lnbits-extensions
          path: './lnbits-extensions'

      - name: setup git user
        run: |
          git config --global user.name "alan"
          git config --global user.email "alan@lnbits.com"

      - name: Create pull request in extensions repo
        working-directory: lnbits-extensions
        env:
          GH_TOKEN: ${{ secrets.EXT_GITHUB }}
          repo_name: '${{ github.event.repository.name }}'
          tag: '${{ github.ref_name }}'
          branch: 'update-${{ github.event.repository.name }}-${{ github.ref_name }}'
          title: '[UPDATE] ${{ github.event.repository.name }} to ${{ github.ref_name }}'
          body: '${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}'
        run: |
          git checkout -b "$branch"

          # Resume an existing update branch when rerunning a release.
          remote_branch=$(git ls-remote --heads origin "$branch")
          if [ -n "$remote_branch" ]; then
            git fetch origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
          fi

          sh util.sh update_extension "$repo_name" "$tag"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$title"
            git push origin "$branch"
          fi

          # Only create a PR when the update differs from the default branch.
          if git diff --quiet origin/HEAD HEAD; then
            exit 0
          fi
          check=$(gh pr list --repo lnbits/lnbits-extensions --head "$branch" --state open --json number --jq 'length')
          if [ "$check" -eq 0 ]; then
            gh pr create --head "$branch" --title "$title" --body "$body" --repo lnbits/lnbits-extensions
          fi
