{% extends "public.html" %} {% block toolbar_title %} Gerty preview {% endblock
%} {% block page %}
<div class="q-pa-md">
  <q-banner v-if="error" class="bg-warning q-mb-md" v-text="error"></q-banner>
  <img
    v-if="imageUrl"
    :src="imageUrl"
    alt="Gerty display preview"
    style="width: 100%; max-width: 960px; height: auto; border: 1px solid #ccc"
    @error="imageFailed"
  />
  <div class="q-mt-md row items-center q-gutter-md">
    <q-btn
      label="Previous"
      :disable="loading || pageCount < 2"
      @click="loadPage((page + pageCount - 1) % pageCount)"
    ></q-btn>
    <span v-text="'Page ' + (page + 1) + ' of ' + pageCount"></span>
    <q-btn
      label="Next"
      :disable="loading || pageCount < 2"
      @click="loadPage((page + 1) % pageCount)"
    ></q-btn>
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  window.app = Vue.createApp({
    el: '#vue',
    mixins: [windowMixin],
    data() {
      return {
        imageUrl: '',
        page: 0,
        pageCount: 1,
        loading: false,
        error: '',
        timer: null
      }
    },
    methods: {
      async loadPage(page = this.page) {
        clearTimeout(this.timer)
        this.loading = true
        try {
          const {data} = await LNbits.api.request(
            'GET',
            `/gerty/api/v1/gerty/pages/{{gerty}}/${page}`
          )
          this.imageUrl = data.image_url
          this.page = data.page
          this.pageCount = data.page_count
          this.error = ''
          this.timer = setTimeout(
            () => this.loadPage(),
            data.refresh_seconds * 1000
          )
        } catch (error) {
          this.error = 'Unable to load the display. Retrying shortly.'
          this.timer = setTimeout(() => this.loadPage(), 30000)
        } finally {
          this.loading = false
        }
      },
      imageFailed() {
        this.error = 'Image unavailable. Fetching a fresh snapshot shortly.'
        clearTimeout(this.timer)
        this.timer = setTimeout(() => this.loadPage(), 5000)
      }
    },
    created() {
      this.loadPage()
    },
    beforeUnmount() {
      clearTimeout(this.timer)
    }
  })
</script>
{% endblock %}
