{% extends "public.html" %} {% block styles %}
<style>
  .gerty-web-page {
    position: fixed;
    inset: 0;
    z-index: 2001;
    overflow: hidden;
    background: #090b14;
    color: #e8ecff;
  }
  .body--light .gerty-web-page {
    background: #f7f5f0;
    color: #292722;
  }
  .gerty-preview-image {
    width: 100%;
    max-width: 960px;
    height: auto;
    border: 1px solid #ccc;
  }
  .gerty-web-page .gerty-preview-image {
    width: 100%;
    height: 100%;
    max-width: none;
    object-fit: contain;
    border: 0;
  }
  .gerty-web-page .gerty-controls {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    flex-wrap: nowrap;
    white-space: nowrap;
    margin: 0;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    z-index: 2;
  }
  .gerty-web-page .gerty-error {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 1;
  }
</style>
{% endblock %} {% block toolbar_title %}Gerty preview{% endblock %} {% block
page %}
<teleport to="body" :disabled="!webPage">
  <div :class="webPage ? 'gerty-web-page' : 'q-pa-md'">
    <q-banner
      v-if="error"
      class="gerty-error bg-warning q-mb-md"
      v-text="error"
    ></q-banner>
    <img
      v-if="imageUrl"
      :src="imageUrl"
      alt="Gerty display preview"
      class="gerty-preview-image"
      @error="imageFailed"
    />
    <div class="gerty-controls q-mt-md row items-center q-gutter-md">
      <q-btn
        label="Previous"
        color="secondary"
        :disable="loading || pageCount < 2"
        @click="loadPage((page + pageCount - 1) % pageCount)"
      ></q-btn>
      <span v-text="'Page ' + (page + 1) + ' of ' + pageCount"></span>
      <q-btn
        label="Next"
        color="primary"
        :disable="loading || pageCount < 2"
        @click="loadPage((page + 1) % pageCount)"
      ></q-btn>
    </div>
  </div>
</teleport>
{% endblock %} {% block footer %}<lnbits-footer v-if="!webPage" />{% endblock %}
{% block scripts %}
<script>
  window.app = Vue.createApp({
    el: '#vue',
    mixins: [windowMixin],
    data() {
      return {
        webPage: {{ web_page | tojson }},
        imageUrl: '',
        page: 0,
        pageCount: 1,
        loading: false,
        error: '',
        timer: null
      }
    },
    methods: {
      async loadPage(page = this.page) {
        clearTimeout(this.timer)
        this.loading = true
        try {
          const params = new URLSearchParams({preview: 'true'})
          if (this.webPage) {
            const styles = getComputedStyle(document.body)
            for (const name of ['primary', 'secondary']) {
              let colour = styles.getPropertyValue(`--q-${name}`).trim()
              if (/^#[0-9a-f]{3}$/i.test(colour)) {
                colour = '#' + [...colour.slice(1)].map(c => c + c).join('')
              }
              if (/^#[0-9a-f]{6}$/i.test(colour)) {
                params.set(`web_${name}`, colour)
              }
            }
            params.set('web_dark', this.$q.dark.isActive)
          }
          const {data} = await LNbits.api.request(
            'GET',
            `/gerty/api/v1/gerty/pages/{{gerty}}/${page}?${params}`
          )
          this.webPage = data.device_type === 'web_page'
          this.imageUrl = data.image_url
          this.page = data.page
          this.pageCount = data.page_count
          this.error = ''
          this.timer = setTimeout(
            () => this.loadPage(this.webPage ? data.next_page : this.page),
            data.refresh_seconds * 1000
          )
        } catch (error) {
          this.error = 'Unable to load the display. Retrying shortly.'
          this.timer = setTimeout(() => this.loadPage(), 30000)
        } finally {
          this.loading = false
        }
      },
      imageFailed() {
        this.error = 'Image unavailable. Fetching a fresh snapshot shortly.'
        clearTimeout(this.timer)
        this.timer = setTimeout(() => this.loadPage(), 5000)
      }
    },
    mounted() {
      this.loadPage()
    },
    watch: {
      'g.themeChoice'() {
        if (this.webPage) this.$nextTick(() => this.loadPage())
      },
      '$q.dark.isActive'() {
        if (this.webPage) this.$nextTick(() => this.loadPage())
      }
    },
    beforeUnmount() {
      clearTimeout(this.timer)
    }
  })
</script>
{% endblock %}
